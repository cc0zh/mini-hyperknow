<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="__EVAL_REPORT_CSP__">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>评测答卷 · 题目、回答与评分理由</title>
  <style>
    :root { --bg: #f5f5f2; --surface: #fff; --ink: #172635; --muted: #536171; --line: #c7cfd6; --accent: #174f86; --soft: #edf4fa; --warn: #764604; --warn-bg: #fff5df; --bad: #a12622; --bad-bg: #fff0ee; --good: #176144; --good-bg: #eaf5ef; --radius: 10px; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { scroll-padding: 24px; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 15px; line-height: 1.65; }
    a { color: var(--accent); text-underline-offset: 3px; }
    button, input, select { font: inherit; color: inherit; }
    button, summary, select { cursor: pointer; }
    button, input, select { min-height: 44px; border: 1px solid #8c9aa7; border-radius: 6px; background: var(--surface); padding: 8px 12px; }
    button { color: var(--accent); font-weight: 600; }
    button:hover { background: var(--soft); border-color: var(--accent); }
    button:active { background: #dceaf6; }
    :focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    h1, h2, h3, h4, p { margin: 0; }
    h1 { font-size: clamp(26px, 3vw, 36px); letter-spacing: -.03em; line-height: 1.3; }
    h2 { font-size: 21px; line-height: 1.4; }
    h3 { font-size: 17px; }
    h4 { font-size: 15px; }
    ul, ol { padding-left: 24px; }
    li + li { margin-top: 8px; }
    pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.75 ui-monospace, "Cascadia Code", Consolas, monospace; tab-size: 2; }
    .prose { font: inherit; }
    .shell { max-width: 1560px; margin: 0 auto; padding: 32px; }
    .skip { position: absolute; top: -100px; left: 16px; z-index: 10; background: white; padding: 12px; }
    .skip:focus { top: 12px; }
    .eyebrow { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .12em; margin-bottom: 8px; }
    .header-row, .section-head, .entry-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .header-row > *, .section-head > *, .entry-heading > * { min-width: 0; }
    .read-only { border: 1px solid var(--line); border-radius: 30px; padding: 6px 14px; white-space: nowrap; background: var(--surface); font-size: 13px; }
    .subtitle, .muted { color: var(--muted); }
    .subtitle { margin-top: 10px; }
    .notice { padding: 14px 18px; margin-top: 20px; border: 1px solid #bc9657; border-left-width: 4px; border-radius: 6px; background: var(--warn-bg); color: var(--warn); }
    .notice p + p { margin-top: 4px; }
    .error { background: var(--bad-bg); border-color: #bc625d; color: var(--bad); }
    .panel { padding: 24px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); margin-top: 24px; min-width: 0; }
    .metadata { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 12px 0 0; color: var(--muted); font-size: 13px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; margin: 20px 0 12px; }
    .stat { border: 1px solid var(--line); border-radius: 7px; padding: 14px 16px; min-width: 0; }
    .stat dt { color: var(--muted); font-size: 13px; }
    .stat dd { font-size: 28px; line-height: 1.3; font-weight: 650; margin: 6px 0 0; font-variant-numeric: tabular-nums; }
    .workspace { display: grid; grid-template-columns: minmax(280px, 340px) minmax(0, 1fr); align-items: start; gap: 24px; }
    .filters { display: grid; gap: 14px; margin-top: 20px; }
    .field { display: grid; gap: 5px; }
    .field label { font-size: 13px; font-weight: 650; }
    input, select { width: 100%; min-width: 0; }
    .filter-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 16px 0; }
    #result-count { font-size: 13px; color: var(--muted); }
    .task-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
    .task-list li { margin: 0; min-width: 0; }
    .task-button { width: 100%; text-align: left; display: grid; gap: 7px; padding: 14px; border-color: var(--line); color: var(--ink); font-weight: 400; }
    .task-button[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 var(--accent); background: var(--soft); }
    .task-title { font-weight: 650; }
    .task-meta { color: var(--muted); font-size: 12px; }
    .badge { display: inline-block; border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; font-size: 12px; font-weight: 650; width: fit-content; color: var(--muted); background: #f2f4f6; }
    .badge.passed, .badge.pass { color: var(--good); background: var(--good-bg); border-color: #90b9a6; }
    .badge.failed, .badge.fail, .badge.invalid { color: var(--bad); background: var(--bad-bg); border-color: #d2a09b; }
    .badge.blocked, .badge.unresolved, .badge.undetermined { color: var(--warn); background: var(--warn-bg); border-color: #c4a56c; }
    .entry-body > section { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); }
    .entry-body section > h3 { margin-bottom: 14px; }
    .entry-body p + p { margin-top: 8px; }
    .facts { display: grid; grid-template-columns: minmax(100px, 150px) minmax(0, 1fr); margin: 14px 0; gap: 8px 16px; }
    .facts dt { color: var(--muted); }
    .facts dd { margin: 0; white-space: pre-wrap; }
    .block { padding: 16px; background: #f7f8f9; border: 1px solid var(--line); border-radius: 6px; margin-top: 12px; }
    details { margin-top: 12px; border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
    summary { padding: 12px 14px; font-weight: 600; min-height: 44px; }
    summary:hover { background: var(--soft); }
    details[open] > summary { border-bottom: 1px solid var(--line); }
    .disclosure-body { padding: 16px; min-width: 0; }
    .disclosure-body > :first-child { margin-top: 0; }
    .check-card { border: 1px solid var(--line); border-radius: 7px; padding: 18px; margin-top: 14px; }
    .check-card h4 { margin: 14px 0 6px; }
    .check-card h4:first-child { margin-top: 0; }
    .ref-buttons { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .ref-buttons button { text-align: left; overflow-wrap: anywhere; max-width: 100%; }
    .timeline > li { padding: 8px 0 12px; border-bottom: 1px solid var(--line); }
    .empty { padding: 28px 18px; border: 1px dashed #8c9aa7; border-radius: 6px; color: var(--muted); background: #f8f9fa; margin-top: 16px; }
    .pair-stats { display: flex; flex-wrap: wrap; gap: 10px 24px; margin: 16px 0; }
    .pair-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin: 12px 0; }
    .pair-side { border: 1px solid var(--line); border-radius: 6px; padding: 16px; min-width: 0; }
    .pair-side button { margin-top: 12px; }
    .pair-list { padding: 0; list-style: none; }
    .navigation-note { font-size: 13px; color: var(--muted); margin-top: 12px; }
    .footer { color: var(--muted); font-size: 12px; padding: 24px 0 0; }
    .wrap, h1, h2, h3, h4, p, dd, summary, button, .task-meta, .metadata { overflow-wrap: anywhere; }
    @media (max-width: 1100px) { .shell { padding: 24px; } .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } .workspace { grid-template-columns: minmax(250px, 290px) minmax(0, 1fr); gap: 16px; } .panel { padding: 20px; } }
    @media (max-width: 760px) { body { font-size: 16px; } .shell { padding: 16px; } .workspace, .pair-grid { grid-template-columns: minmax(0, 1fr); } .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .header-row { flex-wrap: wrap; } .panel { padding: 16px; } .facts { grid-template-columns: minmax(0, 1fr); gap: 3px; } .facts dd { margin-bottom: 10px; } }
    @media print { .shell { padding: 0; } .workspace { display: block; } #task-browser, .skip, #back-to-tasks { display: none; } .panel { break-inside: avoid; } }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>
  <a class="skip" href="#main-content">跳到评测结果</a>
  <div class="shell">
    <header>
      <p class="eyebrow">评测答卷 · 离线报告</p>
      <div class="header-row">
        <div><h1>看看 AI 这次答得怎么样</h1><p class="subtitle">先看结论，再看用户问了什么、AI 怎样回答，以及每项评分的理由。</p></div>
        <span class="read-only">仅本地 · 只读</span>
      </div>
      <aside class="notice" aria-label="私密与只读提示">
        <p><strong>含原始对话和内部评分标准，请勿直接外发。</strong> 这里只查看已保存的结果，不调用模型、不修改评分。</p>
      </aside>
    </header>
    <main id="main-content" tabindex="-1">
      <section id="export-error" class="notice error" role="alert">
        <h2 id="export-error-title">导出数据尚未读取</h2>
        <p id="export-error-message">若此提示持续显示，可能是导出损坏或脚本被安全策略阻止。请从可信的本地结果重新导出，不要放宽浏览器安全设置。</p>
      </section>
      <noscript><p class="notice error">浏览器未启用 JavaScript，无法读取本地评测数据。此页面不会联网；请在允许此本地报告脚本的环境中打开。</p></noscript>
      <div id="report-app" hidden>
        <section id="overview" class="panel" aria-labelledby="overview-title">
          <h2 id="overview-title">结果概览</h2>
          <p id="report-sentence" class="subtitle"></p>
          <div id="report-meta" class="metadata"></div>
          <dl id="status-counts" class="stats"></dl>
          <p id="count-note" class="muted"></p>
          <div id="report-notes"></div>
          <div id="report-raw"></div>
        </section>
        <section id="comparison" class="panel" aria-labelledby="comparison-title" hidden>
          <h2 id="comparison-title">版本比较</h2>
          <p class="muted">仅展示既有配对判断，不推断统计显著性，不自动接受版本。</p>
          <div id="comparison-counts" class="pair-stats"></div>
          <div id="comparison-navigation"></div>
          <div id="comparison-raw"></div>
        </section>
        <div class="workspace">
          <section id="task-browser" class="panel" aria-labelledby="task-browser-title">
            <h2 id="task-browser-title">先选一道题</h2>
            <div class="filters" role="search" aria-label="筛选评测任务">
              <div class="field"><label for="task-search">搜索题目</label><input id="task-search" type="search" placeholder="输入题目关键词，也支持任务 ID" autocomplete="off"></div>
              <div class="field"><label for="status-filter">结果状态</label><select id="status-filter"><option value="">全部状态</option></select></div>
              <div class="field"><label for="version-filter">被测版本</label><select id="version-filter"><option value="">全部版本</option></select></div>
            </div>
            <div class="filter-footer"><p id="result-count" role="status" aria-live="polite" aria-atomic="true"></p><button id="reset-filters" type="button">清除筛选</button></div>
            <p id="list-empty" class="empty" hidden></p>
            <ul id="task-list" class="task-list" aria-label="任务列表"></ul>
          </section>
          <article id="entry-detail" class="panel" aria-labelledby="detail-title">
            <div class="section-head"><h2 id="detail-title" tabindex="-1">任务详情</h2><button id="back-to-tasks" type="button">返回目录</button></div>
            <div id="entry-body" class="entry-body"></div>
          </article>
        </div>
      </div>
    </main>
    <footer class="footer">离线快照 · 所有正文按纯文本显示 · 无运行、重评或联网操作</footer>
  </div>
  <script id="report-data" type="application/json">__EVAL_REPORT_DATA__</script>
  <script>
    (() => {
      "use strict";
      const $ = (id) => document.getElementById(id);
      const object = (value) => value !== null && typeof value === "object" && !Array.isArray(value);
      const array = (value) => Array.isArray(value) ? value : [];
      const known = (value) => value !== null && value !== undefined;
      const printable = (value) => !known(value) ? "未知" : typeof value === "string" ? value : JSON.stringify(value, null, 2);
      const canonical = (value) => {
        if (Array.isArray(value)) return "[" + value.map(canonical).join(",") + "]";
        if (object(value)) return "{" + Object.keys(value).sort().map((key) => JSON.stringify(key) + ":" + canonical(value[key])).join(",") + "}";
        return JSON.stringify(value);
      };
      const compact = (value, limit = 40) => {
        if (typeof value !== "string" && typeof value !== "number") return "";
        const text = String(value).replace(/\s+/g, " ").trim();
        return text.length > limit ? text.slice(0, limit) + "…" : text;
      };
      const identityLabel = (value) => object(value) ? compact(value.label || value.name || value.id || value.version || value.commit || value.sha256) : compact(value);
      const subjectLabel = (subject) => {
        if (!object(subject) || !Object.keys(subject).length) return "未知版本（不作提交归因）";
        const named = compact(subject.label, 56) || compact(subject.name, 56);
        if (named) return named;
        const parts = [];
        const identity = identityLabel(subject.identity) || compact(subject.version) || compact(subject.commit, 12);
        const manifest = typeof subject.source_manifest_sha256 === "string" ? subject.source_manifest_sha256.trim().slice(0, 12) : "";
        const assembly = identityLabel(subject.assembly);
        if (identity) parts.push(identity);
        if (manifest) parts.push("源码 " + manifest);
        else if (assembly) parts.push("组装 " + compact(assembly, 28));
        if (!parts.length) parts.push("未知版本（不作提交归因）");
        const model = object(subject.business_configuration) ? compact(subject.business_configuration.model, 32) : "";
        if (model) parts.push(model);
        return parts.join(" · ");
      };
      const statuses = { passed: "通过", failed: "未达标", blocked: "执行未完成", unresolved: "还不能下结论", pending: "尚无结果", invalid: "结果不匹配" };
      const verdicts = { pass: "通过", fail: "未达标", undetermined: "尚不能判断" };
      const sides = { report: "本次结果", baseline: "原版本", candidate: "新版本" };
      const statusText = (value) => Object.hasOwn(statuses, value) ? statuses[value] : "未知状态（" + printable(value) + "）";
      const node = (tag, text, className) => {
        const result = document.createElement(tag);
        if (known(text)) result.textContent = printable(text);
        if (className) result.className = className;
        return result;
      };
      const message = (parent, text, error = false) => parent.append(node("p", text, error ? "notice error" : "empty"));
      const badge = (value, labels = statuses) => node("span", Object.hasOwn(labels, value) ? labels[value] : "未知（" + printable(value) + "）", "badge " + (Object.hasOwn(labels, value) ? value : "unknown"));
      const button = (label, handler, id) => {
        const result = node("button", label);
        result.type = "button";
        if (id) result.id = id;
        result.addEventListener("click", handler);
        return result;
      };
      const facts = (parent, entries) => {
        const list = node("dl", null, "facts");
        entries.forEach(([label, value]) => list.append(node("dt", label), node("dd", printable(value))));
        parent.append(list);
      };
      const disclosure = (parent, label, build, open = false) => {
        const details = node("details");
        const summary = node("summary", label);
        const body = node("div", null, "disclosure-body");
        details.append(summary, body);
        let built = false;
        const populate = () => { if (!built) { built = true; build(body); } };
        details.addEventListener("toggle", () => { if (details.open) populate(); });
        if (open) { details.open = true; populate(); }
        parent.append(details);
        return { details, summary, body, populate };
      };
      const json = (parent, label, value, open = false) => disclosure(parent, label, (body) => body.append(node("pre", printable(value))), open);
      const section = (parent, title, id) => {
        const result = node("section");
        if (id) result.id = id;
        result.append(node("h3", title));
        parent.append(result);
        return result;
      };
      const booleanText = (value) => value === true ? "是" : value === false ? "否" : "未知";
      const countValue = (value) => typeof value === "number" && Number.isFinite(value) && value >= 0 ? value : "未知";
      let payload, entries, selected = -1;
      const entryIndex = new Map();
      const versionKeys = [];
      const versionLabels = new Map();
      const entryButtons = new Map();
      let evidenceTargets = new Map();

      function validate(value) {
        if (!object(value) || value.schema_version !== 1 || !["report", "comparison"].includes(value.kind) || !object(value.report) || !Array.isArray(value.entries) || !Array.isArray(value.notes)) throw new Error("不支持的数据版本或报告结构不完整。");
        value.entries.forEach((entry, index) => {
          if (!object(entry) || typeof entry.key !== "string" || typeof entry.trial_id !== "string" || !Object.hasOwn(sides, entry.side) || typeof entry.status !== "string" || !Array.isArray(entry.evidence) || !Array.isArray(entry.actions) || !Array.isArray(entry.grades) || !(entry.summary === null || object(entry.summary)) || !(entry.case === null || object(entry.case)) || !(entry.subject === null || object(entry.subject)) || entry.evidence.some((item) => !object(item))) throw new Error("第 " + (index + 1) + " 个任务条目结构损坏。");
        });
        if (value.kind === "comparison" && (!Array.isArray(value.report.pairs) || !Array.isArray(value.report.unpaired) || value.report.pairs.some((pair) => !object(pair) || !object(pair.baseline) || !object(pair.candidate)) || value.report.unpaired.some((item) => !object(item)))) throw new Error("比较数据缺少完整的配对 / 不可配对列表。");
      }

      function renderOverview() {
        const report = payload.report;
        $("report-meta").append(node("span", "类型：" + (payload.kind === "comparison" ? "版本比较" : "评测报告")), node("span", "生成时间：" + printable(payload.generated_at)));
        if (known(report.experiment_id)) $("report-meta").append(node("span", "实验 ID：" + printable(report.experiment_id)));
        const counts = object(report.counts) ? report.counts : {};
        const authoritative = object(counts.by_status);
        const counted = authoritative ? counts.by_status : entries.reduce((result, entry) => { result[entry.status] = (result[entry.status] || 0) + 1; return result; }, Object.create(null));
        const values = [[report.scope === "selected_results" ? "所选结果" : "计划", countValue(counts.planned)], ...Object.keys(statuses).map((status) => [status === "pending" ? "无结果" : statuses[status], countValue(Object.hasOwn(counted, status) ? counted[status] : 0)])];
        if (known(counts.invalid)) values[6][1] = countValue(counts.invalid);
        values.forEach(([label, value], index) => { if (index > 2 && value === 0) return; const item = node("div", null, "stat"); item.append(node("dt", label), node("dd", value)); $("status-counts").append(item); });
        $("report-sentence").textContent = "这是一份已保存的答卷，不是新的评测。先在下方选题，再按「题目 → 回答 → 评分理由」阅读。";
        if (entries.length === 1) $("report-sentence").textContent = entryExplanation(entries[0]);
        $("count-note").textContent = (authoritative ? "状态按原报告计数；" : "状态按导出条目计数；") + "无结果保留在任务目录，无效记录可能与计划任务重叠。计划未提供时显示未知。不计算总分或通过率。已收到结果：" + printable(counts.received) + "。";
        if (report.scope === "selected_results") $("count-note").textContent = "仅展示显式提供的结果，未关联完整实验计划，不代表全部计划任务的覆盖情况。不计算总分或通过率。所选结果：" + printable(counts.received) + "。";
        const unknownStatuses = Object.keys(counted).filter((key) => !Object.hasOwn(statuses, key));
        if (unknownStatuses.length) message($("report-notes"), "另有未知状态：" + unknownStatuses.map((key) => key + "（" + printable(counted[key]) + "）").join("、"), true);
        const notes = [...array(payload.notes), ...array(report.notes)];
        if (notes.length) disclosure($("report-notes"), "报告范围、隐私与评分限制（展开了解）", (body) => { const list = node("ul", null, "muted"); notes.forEach((note) => list.append(node("li", printable(note)))); body.append(list); });
        if (!entries.length) message($("report-notes"), "此导出没有任务条目，无法查看任务或证据。若原计划含任务，请检查导出输入及计划是否完整。", true);
        json($("report-raw"), "展开报告原始 JSON（含无效结果与计划信息）", report);
      }

      function initializeFilters() {
        const options = new Set([...Object.keys(statuses), ...entries.map((entry) => entry.status)]);
        options.forEach((status) => { const option = node("option", statusText(status)); option.value = status; $("status-filter").append(option); });
        entries.forEach((entry, index) => {
          const version = canonical(entry.subject);
          versionKeys[index] = version;
          if (!versionLabels.has(version)) {
            versionLabels.set(version, subjectLabel(entry.subject));
          }
          const key = JSON.stringify([entry.side, entry.trial_id]);
          if (!entryIndex.has(key)) entryIndex.set(key, []);
          entryIndex.get(key).push(index);
        });
        const labels = [...versionLabels.values()];
        let index = 0;
        versionLabels.forEach((label, key) => {
          index += 1;
          const option = node("option", label + (labels.filter((value) => value === label).length > 1 ? " · 身份 " + index : ""));
          option.value = key;
          $("version-filter").append(option);
        });
        ["task-search", "status-filter", "version-filter"].forEach((id) => $(id).addEventListener(id === "task-search" ? "input" : "change", renderList));
        $("reset-filters").addEventListener("click", () => { resetFilters(); renderList(); });
        $("back-to-tasks").addEventListener("click", () => {
          const target = entryButtons.get(selected) || $("task-search");
          target.focus();
          target.scrollIntoView({ block: "center" });
        });
      }

      function resetFilters() { ["task-search", "status-filter", "version-filter"].forEach((id) => { $(id).value = ""; }); }

      function renderList() {
        const query = $("task-search").value.trim().toLocaleLowerCase("zh-CN");
        const status = $("status-filter").value;
        const version = $("version-filter").value;
        const visible = [];
        $("task-list").replaceChildren();
        entryButtons.clear();
        entries.forEach((entry, index) => {
          const task = entry.case || {};
          if (query && !(printable(task.id) + " " + printable(task.title)).toLocaleLowerCase("zh-CN").includes(query)) return;
          if (status && entry.status !== status || version && versionKeys[index] !== version) return;
          visible.push(index);
          const item = node("li");
          const control = button(null, () => selectEntry(index, true), "entry-select-" + index);
          control.className = "task-button";
          control.append(node("span", task.title || task.id || "未提供任务定义", "task-title"), badge(entry.status), node("span", "记录 " + (index + 1) + " · " + sides[entry.side], "task-meta"), node("span", "版本：" + versionLabels.get(versionKeys[index]), "task-meta"));
          control.setAttribute("aria-controls", "entry-detail");
          item.append(control);
          $("task-list").append(item);
          entryButtons.set(index, control);
        });
        $("result-count").textContent = "显示 " + visible.length + " / " + entries.length + " 个任务";
        $("list-empty").hidden = visible.length > 0;
        $("list-empty").textContent = entries.length ? "没有匹配的任务。请调整条件或清除筛选。" : "没有可查看的任务条目。";
        if (!visible.includes(selected)) {
          if (visible.length) selectEntry(visible[0], false);
          else { selected = -1; $("detail-title").textContent = "任务详情"; $("entry-body").replaceChildren(); message($("entry-body"), entries.length ? "当前筛选为空。调整左侧条件后选择任务。" : "暂无结果。此报告没有可查看的任务或证据。"); }
        }
        updateSelection();
      }

      function updateSelection() { entryButtons.forEach((control, index) => { if (index === selected) control.setAttribute("aria-current", "true"); else control.removeAttribute("aria-current"); }); }

      function entryExplanation(entry) {
        const summary = entry.summary || {};
        if (entry.status === "unresolved" && array(summary.measurement_errors).some((error) => object(error) && error.type === "grader_error")) return "自动评分器报错，所以还不能判断这份回答是否达标。评分没完成，不等于 AI 的回答不合格；请先看下方实际保存的回答。";
        if (entry.status === "unresolved" && summary.grading_current === false) return "保存的评分已不适用于当前材料或标准，暂时不能据此判断好坏。这里只展示记录，不会自动重评。";
        const descriptions = {
          passed: "保存的评测结论是通过：这份答卷满足本次自动检查的要求，不代表已经过真人确认。",
          failed: "保存的评测结论是未达标。请在第三部分查看具体哪一项没有通过，以及评分给出的理由。",
          blocked: "本次执行没有正常完成，不能只看有没有回答就认定任务完成。原始执行问题保留在技术详情中。",
          unresolved: "现有记录还不足以得出可靠结论。请区分：AI 是否交付了回答，以及评分是否已经完成。",
          pending: "计划里有这道题，但没有与之匹配的已保存结果。不是通过，也不是失败。",
          invalid: "这条结果与当前实验计划或要求的结果身份不匹配，不能当作该任务的有效完成。具体不匹配原因保留在技术详情中。"
        };
        return descriptions[entry.status] || "这条记录使用了未识别的状态，不能推断它是否通过。请查看原始记录。";
      }

      function revealEvidence(id) {
        const targets = evidenceTargets.get(id) || [];
        if (targets.length !== 1) return false;
        const target = targets[0];
        target.view.populate();
        target.group.details.open = true;
        target.view.details.open = true;
        for (let ancestor = target.group.details.parentElement; ancestor; ancestor = ancestor.parentElement) if (ancestor.tagName === "DETAILS") ancestor.open = true;
        target.view.summary.focus();
        target.view.summary.scrollIntoView({ block: "center" });
        return true;
      }

      function renderAnswerOverview(parent, evidence) {
        const records = new Map();
        evidence.forEach((source) => {
          const data = object(source.data) ? source.data : {};
          array(data.turns).forEach((turn) => {
            if (!object(turn)) return;
            const key = canonical(turn);
            if (!records.has(key)) records.set(key, { turn, sources: [] });
            records.get(key).sources.push(source);
          });
        });
        if (!records.size) message(parent, "没有找到可直接阅读的对话正文。这不等于没有执行记录；非对话材料和完整原文仍可在下方技术详情中查看。");
        let index = 0;
        records.forEach(({ turn, sources }) => {
          const block = node("div", null, "block");
          block.append(node("h4", "对话记录 " + (++index)));
          if (sources.some((source) => !source.integrity || source.integrity.valid !== true)) message(block, "注意：这段材料至少有一份来源未通过完整性确认，请勿据此直接认定评分正确。", true);
          if (typeof turn.user_text === "string") block.append(node("h4", "用户说"), node("pre", turn.user_text, "prose"));
          if (object(turn.response) && typeof turn.response.text === "string") block.append(node("h4", "AI 回答"), node("pre", turn.response.text, "prose"));
          else message(block, "这一条记录没有可直接阅读的回答正文；请核对原始材料。");
          const controls = node("div", null, "ref-buttons");
          sources.forEach((source, sourceIndex) => controls.append(button(sources.length > 1 ? "核对原始来源 " + (sourceIndex + 1) : "核对这段回答的原始来源", () => { if (!revealEvidence(source.evidence_id)) message(block, "来源缺失或重复，不能唯一定位。请展开技术详情核对。", true); })));
          block.append(controls);
          parent.append(block);
        });
      }

      function selectEntry(index, moveFocus) {
        selected = index;
        updateSelection();
        const entry = entries[index];
        const task = entry.case || {};
        const summary = entry.summary || {};
        const body = $("entry-body");
        body.replaceChildren();
        evidenceTargets = new Map();
        $("detail-title").textContent = task.title || task.id || "未提供任务定义";
        const intro = node("div", null, "block");
        intro.append(badge(entry.status));
        intro.append(node("p", entryExplanation(entry)));
        const navigation = node("div", null, "ref-buttons");
        [["看用户题目", "task-section"], ["看 AI 回答", "answers-section"], ["看评分理由", "checks-section"]].forEach(([label, id]) => navigation.append(button(label, () => { const target = $(id); const heading = target.querySelector("h3"); heading.tabIndex = -1; heading.focus(); target.scrollIntoView({ block: "start" }); })));
        intro.append(navigation);
        intro.append(node("p", "被测版本：" + versionLabels.get(versionKeys[index]), "muted"));
        if (summary.calibration_status === "unreviewed") intro.append(node("p", "人工复核：尚未独立校准，不能把自动评分当作真人确认。", "muted"));
        body.append(intro);
        if (!entry.summary && entry.status !== "pending") message(body, "没有可用的当前评分摘要，不会拿旧评分或页面推测来补算结果。", true);
        const taskSection = section(body, "1. 用户问了什么", "task-section");
        const input = object(task.task) ? task.task.input : task.task;
        const text = typeof input === "string" ? input : object(input) && typeof input.text === "string" ? input.text : null;
        if (text !== null) taskSection.append(node("pre", text, "prose block"));
        else { taskSection.append(node("p", "这道题使用结构化材料，可展开查看完整内容。", "muted")); json(taskSection, "查看题目材料", task.task); }
        const answersSection = section(body, "2. AI 实际怎样回答", "answers-section");
        renderAnswerOverview(answersSection, entry.evidence);
        const checksSection = section(body, "3. 这次是怎么评分的", "checks-section");
        checksSection.append(node("p", "每一项都说明检查什么、评分理由和依据。通过只是这一项通过；「尚不能判断」不是未达标。这里只展示已保存的评分。", "muted"));
        const technical = disclosure(body, "技术详情（原始证据、执行与评分记录）", (technicalBody) => {
        facts(technicalBody, [["任务 ID / 版本", printable(task.id) + " / " + printable(task.version)], ["执行身份", sides[entry.side] + " / " + printable(entry.trial_id)], ["原始结果说明", entry.reason], ["标签", task.tags]]);
        json(technicalBody, "前置资料 / prerequisites", task.prerequisites);
        json(technicalBody, "参考事实 / reference_facts（私有）", task.reference_facts);
        json(technicalBody, "版本身份 / subject（完整快照）", entry.subject);
        json(technicalBody, "任务定义 / case（完整 JSON）", entry.case);
        const evidenceSection = section(technicalBody, "原始证据 · 按保存时点查看", "evidence-section");
        renderEvidence(evidenceSection, entry.evidence);
        const timeline = section(technicalBody, "动作时间线与错误", "timeline-section");
        facts(timeline, [["业务状态", summary.business_status], ["执行已确认结束 / settled", booleanText(summary.settled)], ["当前评分有效 / grading_current", booleanText(summary.grading_current)], ["校准状态", summary.calibration_status]]);
        renderErrors(timeline, "测量错误", summary.measurement_errors);
        renderErrors(timeline, "执行错误", summary.execution_errors);
        if (!entry.actions.length) message(timeline, "未记录动作时间线；不推断执行过程。");
        else {
          const list = node("ol", null, "timeline");
          entry.actions.forEach((action, i) => { const item = node("li"); const record = object(action) ? action : {}; const request = object(record.request) ? record.request : {}; item.append(node("h4", "动作 " + (i + 1) + " · " + printable(request.name || record.step_id || record.type || record.action || record.name)), node("p", "时间：" + printable(record.submitted_at || record.prepared_at || record.committed_at || record.timestamp || record.at || record.captured_at) + " · 状态：" + printable(record.status), "muted")); json(item, "展开完整动作记录", action); list.append(item); });
          timeline.append(list);
        }
        const audit = section(technicalBody, "评分历史、用量与配置", "audit-section");
        facts(audit, [["当前 attempt", summary.attempt_id], ["评分定义 hash", summary.definition_hash], ["超出预算", booleanText(summary.budget_exceeded)]]);
        json(audit, "业务用量 / business_usage", summary.business_usage);
        json(audit, "评分用量 / grading_usage", summary.grading_usage);
        json(audit, "预算 / budget", entry.budget);
        json(audit, "环境与配置 / environment", entry.environment);
        json(audit, "评分 attempt 历史 / grades（仅供追溯，不替代当前评分）", entry.grades);
        json(audit, "当前权威摘要 / summary（完整 JSON）", entry.summary);
        json(audit, "完整导出条目 / entry（所有字段）", entry);
        });
        technical.details.id = "technical-details";
        technical.populate();
        renderChecks(checksSection, task, summary);
        if (moveFocus) { $("detail-title").focus(); $("entry-detail").scrollIntoView({ block: "start" }); }
      }

      function renderErrors(parent, label, value) {
        if (!Array.isArray(value)) { parent.append(node("p", label + "：未知 / 未提供。", "muted")); return; }
        if (!value.length) { parent.append(node("p", label + "：记录为 0 条。", "muted")); return; }
        const warning = node("div", null, "notice error");
        warning.append(node("h4", label + "：" + value.length + " 条"));
        json(warning, "展开全部" + label, value, true);
        parent.append(warning);
      }

      function renderSavedContent(parent, data) {
        if (!object(data)) return;
        array(data.turns).forEach((turn, index) => {
          if (!object(turn)) return;
          const block = node("div", null, "block");
          block.append(node("h4", "已保存对话 · 第 " + (index + 1) + " 轮"));
          if (typeof turn.user_text === "string") block.append(node("h4", "用户原话"), node("pre", turn.user_text, "prose"));
          if (object(turn.response) && typeof turn.response.text === "string") block.append(node("h4", "回复正文（纯文本）"), node("pre", turn.response.text, "prose"));
          else message(block, "没有可直接展示的 response.text；请展开本轮完整记录查看实际保存结构。");
          facts(block, [["保存状态", turn.status], ["turn_id", turn.turn_id], ["run_id", turn.run_id]]);
          json(block, "本轮完整记录（含计划与问题）", turn);
          parent.append(block);
        });
        if (array(data.artifacts).length) json(parent, "已保存教学产物（完整 JSON；HTML 仅文本）", data.artifacts);
      }

      function renderEvidence(parent, evidence) {
        parent.append(node("p", "证据为纯文本 / JSON；内容完整保留，展开后可查看所有字段。完整性标记来自本次导出校验，不代表真实性认证。", "muted"));
        if (!evidence.length) { message(parent, "没有已保存证据。不会用页面示例或模型回答替代。"); return; }
        const damaged = evidence.filter((item) => item.integrity && item.integrity.valid === false).length;
        const unchecked = evidence.filter((item) => !item.integrity || typeof item.integrity.valid !== "boolean").length;
        if (damaged) message(parent, "证据损坏警告：" + damaged + " 份证据校验失败。请勿把损坏内容当作可靠评分依据。", true);
        if (unchecked) message(parent, "完整性未知：" + unchecked + " 份证据未提供明确的校验结果。", true);
        const groups = new Map();
        evidence.forEach((item, index) => {
          const checkpoint = printable(item.checkpoint_id);
          if (!groups.has(checkpoint)) groups.set(checkpoint, []);
          groups.get(checkpoint).push({ item, index });
        });
        groups.forEach((members, checkpoint) => {
          const group = disclosure(parent, "Checkpoint " + checkpoint + " · " + members.length + " 份证据", () => {}, false);
          members.forEach(({ item, index }) => {
            const integrity = item.integrity || {};
            const state = integrity.valid === false ? "校验失败 · 证据损坏" : integrity.valid === true ? "完整性校验通过" : "完整性未知";
            const evidenceView = disclosure(group.body, printable(item.evidence_id) + " · " + state, (content) => {
              if (integrity.valid !== true) message(content, integrity.valid === false ? "警告：证据损坏。" + printable(integrity.error) : "警告：此证据完整性未知。", true);
              renderSavedContent(content, item.data);
              facts(content, [["evidence_id", item.evidence_id], ["checkpoint_id", item.checkpoint_id], ["保存时间", item.captured_at], ["SHA-256", item.sha256], ["完整性", state]]);
              json(content, "完整 data（含调用与元数据）", item.data);
              content.append(node("h4", "观察 / observation"));
              content.append(node("pre", printable(item.observation), "prose block"));
              json(content, "证据完整原始 JSON（含所有附加字段）", item);
            });
            evidenceView.details.id = "evidence-" + index;
            const key = typeof item.evidence_id === "string" ? item.evidence_id : null;
            if (key !== null) { if (!evidenceTargets.has(key)) evidenceTargets.set(key, []); evidenceTargets.get(key).push({ group, view: evidenceView }); }
          });
        });
      }

      function renderChecks(parent, task, summary) {
        const definitions = array(task.checks);
        const results = array(summary.checks);
        const ids = new Set(definitions.map((check) => object(check) ? check.check_id : undefined));
        const rows = [...definitions.map((definition) => ({ definition })), ...results.filter((result) => !object(result) || !ids.has(result.check_id)).map((result) => ({ definition: null, result }))];
        if (!rows.length) { message(parent, "没有可展示的检查项或评分。无结果不代表全部通过。"); return; }
        rows.forEach((row, checkIndex) => {
          const definition = object(row.definition) ? row.definition : {};
          const matches = known(row.result) ? [row.result] : results.filter((item) => object(item) && item.check_id === definition.check_id);
          const card = node("div", null, "check-card");
          card.append(node("h4", "检查 " + (checkIndex + 1) + " · " + printable(definition.criterion || definition.check_id || (row.result || {}).check_id)));
          facts(card, [["怎样算通过", definition.pass_when], ["什么情况不通过", definition.fail_when]]);
          json(card, "展开详细标准与系统字段", row.definition);
          card.append(node("h4", "这一项的评分"));
          if (!row.definition) message(card, "此评分没有匹配的任务判据；不猜测对应定义。", true);
          if (matches.length !== 1 || !object(matches[0])) { message(card, matches.length > 1 ? "评分 ID 重复，存在歧义，不猜选评分。" : "当前摘要没有此检查项评分；结果未知。", matches.length > 1); if (matches.length) json(card, "原始评分记录", matches); }
          else {
            const result = matches[0];
            card.append(badge(result.verdict, verdicts));
            const reason = typeof result.reason === "string" && result.reason.startsWith("grader_error:") ? "自动评分器报错，这一项没有得出有效结论。原始错误保留在下面的评分记录里。" : typeof result.reason === "string" ? result.reason.replaceAll("Case要求", "本题要求") : result.reason;
            facts(card, [["为什么这样评分", reason]]);
            if (known(result.quote)) { card.append(node("h4", "评分引用原文"), node("pre", printable(result.quote), "prose block")); }
            const refs = array(result.evidence_refs);
            if (!refs.length) card.append(node("p", "无证据引用。", "muted"));
            else {
              const controls = node("div", null, "ref-buttons");
              refs.forEach((ref, refIndex) => {
                const id = typeof ref === "string" ? ref : object(ref) ? ref.evidence_id : undefined;
                const targets = evidenceTargets.get(id) || [];
                if (targets.length === 1) controls.append(button("查看这项判断的原始依据" + (refs.length > 1 ? " " + (refIndex + 1) : ""), () => revealEvidence(id), "evidence-ref-" + checkIndex + "-" + refIndex));
                else controls.append(node("p", "证据引用" + (targets.length > 1 ? "存在歧义（同名证据），拒绝猜选：" : "缺失或无法定位：") + printable(ref), "notice error"));
              });
              card.append(controls);
            }
            json(card, "完整权威检查结果（含 evidence_refs）", result);
          }
          parent.append(card);
        });
      }

      function entryNavigation(parent, side, trialId, label, id) {
        const matches = entryIndex.get(JSON.stringify([side, trialId])) || [];
        if (matches.length !== 1) { message(parent, matches.length ? "导航歧义：" + sides[side] + " / " + printable(trialId) + " 对应多个条目，拒绝猜选。" : "无法定位条目：" + printable(side) + " / " + printable(trialId) + "。", true); return; }
        parent.append(button(label, () => { resetFilters(); renderList(); selectEntry(matches[0], true); }, id));
      }

      function renderComparison() {
        if (payload.kind !== "comparison") return;
        $("comparison").hidden = false;
        const report = payload.report;
        const changes = { improved: "有改善", regressed: "有退化", unchanged: "未变化", unresolved: "变化待判" };
        Object.entries(changes).forEach(([key, label]) => $("comparison-counts").append(node("strong", label + "：" + report.pairs.filter((pair) => pair.change === key).length)));
        $("comparison-counts").append(node("strong", "不可配对：" + report.unpaired.length), node("span", "配对数：" + report.pairs.length));
        const navigation = $("comparison-navigation");
        if (!report.pairs.length) message(navigation, "没有可配对的结果；请查看不可配对原因，不据此推断改善或退化。");
        report.pairs.forEach((pair, index) => {
          const before = object(pair.baseline) ? pair.baseline : {};
          const after = object(pair.candidate) ? pair.candidate : {};
          const view = disclosure(navigation, "配对 " + (index + 1) + " · " + (Object.hasOwn(changes, pair.change) ? changes[pair.change] : "未知变化：" + printable(pair.change)) + " · " + printable(before.case_id || after.case_id), (content) => {
            const grid = node("div", null, "pair-grid");
            [["baseline", before], ["candidate", after]].forEach(([side, summary]) => {
              const column = node("div", null, "pair-side");
              column.append(node("h3", sides[side]), badge(summary.status));
              facts(column, [["trial_id", summary.trial_id], ["版本身份", subjectLabel(summary.subject)], ["业务状态", summary.business_status], ["校准状态", summary.calibration_status]]);
              entryNavigation(column, side, summary.trial_id, "查看" + sides[side] + "任务与证据", "pair-" + index + "-" + side);
              json(column, "配对权威摘要（完整 JSON）", summary);
              grid.append(column);
            });
            content.append(grid);
            json(content, "配对身份与原始记录（完整 JSON）", pair);
          });
          view.details.id = "comparison-pair-" + index;
        });
        if (report.unpaired.length) disclosure(navigation, "不可配对记录 · " + report.unpaired.length + " 条", (content) => {
          const list = node("ul", null, "pair-list");
          report.unpaired.forEach((item, index) => {
            const row = node("li", null, "block");
            row.append(node("h3", (sides[item.side] || printable(item.side)) + " / " + printable(item.trial_id)));
            facts(row, [["不可配对原因", item.reasons]]);
            entryNavigation(row, item.side, item.trial_id, "查看任务与原始证据", "unpaired-" + index);
            json(row, "完整不可配对记录", item);
            list.append(row);
          });
          content.append(list);
        });
        navigation.append(node("p", "比较导航按 side + trial_id 精确映射；重复身份显示歧义，不自动选择。所有任务仍保留在任务目录中。", "navigation-note"));
        json($("comparison-raw"), "展开原始 comparison JSON（完整数据）", report);
      }

      try {
        payload = JSON.parse($("report-data").textContent);
        validate(payload);
        entries = payload.entries;
        renderOverview();
        initializeFilters();
        renderComparison();
        renderList();
        $("export-error").hidden = true;
        $("report-app").hidden = false;
      } catch (error) {
        $("report-app").hidden = true;
        $("export-error").hidden = false;
        $("export-error-title").textContent = "导出损坏或数据版本不受支持";
        $("export-error-message").textContent = "此页面不能可靠展示评测结果。" + printable(error.message) + " 请从可信的本地结果重新导出；不会尝试运行或修复模型内容。";
      }
    })();
  </script>
</body>
