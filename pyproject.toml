[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-hyperknow-agent-core"
version = "0.1.0"
description = "Python Agent V1 kernel with durable context and controlled tools"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "openai>=1.0.0",
    "pydantic>=2.9",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hyperknow = ["skills/*/SKILL.md"]
eval_core = ["report_template.html"]

[dependency-groups]
dev = [
    "httpx>=0.27",
]
